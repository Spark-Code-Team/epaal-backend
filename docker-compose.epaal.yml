version: '3.9'

services:
  epaal-db:
    image: postgres:15
    container_name: epaal_db
    environment:
      - POSTGRES_DB=epaal_db
      - POSTGRES_USER=epaal_user
      - POSTGRES_PASSWORD=epaal_pass
    volumes:
      - epaal_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # پورت متفاوت چون 5432 برای پروژه دیگه رزرو شده

  epaal-web:
    build: .
    command: gunicorn EvaamBack.wsgi:application --bind 0.0.0.0:8001
    volumes:
      - .:/code
      - static_volume:/code/staticfiles
      - media_volume:/code/uploads
    ports:
      - "8001:8001"
    env_file:
      - ./.env-dev
    environment:
        POSTGRES_DB: "epaal_db"
        POSTGRES_HOST: "epaal_db"
        POSTGRES_PORT: 5432
        POSTGRES_USER: "epaal_user"
        POSTGRES_PASSWORD: "epaal_pass"
        DEBUG: 0
    depends_on:
      - epaal-db

volumes:
  epaal_pg_data:
  static_volume:
  media_volume:
